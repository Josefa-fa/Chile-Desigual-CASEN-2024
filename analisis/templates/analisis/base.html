<!DOCTYPE html>
<html lang="es-CL">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{% block titulo %}Chile desigual | CASEN 2024{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        html, body {
            margin: 0;
            padding: 0;
            min-height: 100%;
        }

        body {
            background-color: #f4f7fb;
            color: #243447;
            font-family: Arial, sans-serif;
        }

        h2 {
            color: #17324d;
        }

        .encabezado {
            background-color: #17324d;
            color: white;
            padding: 25px 15px;
            text-align: center;
        }

        .encabezado h1 {
            color: white;
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .encabezado p {
            color: white;
            margin-bottom: 0;
            font-size: 15px;
        }

        .layout-principal {
            display: flex;
            align-items: stretch;
            min-height: calc(100vh - 180px);
        }

        .menu-vertical {
            width: 250px;
            min-width: 250px;
            flex-shrink: 0;
            background-color: #244765;
            padding: 25px 15px;
        }

        .menu-vertical h4 {
            color: white;
            font-size: 21px;
            font-weight: bold;
            margin-bottom: 25px;
        }

        .menu-vertical .nav-link {
            display: block;
            width: 100%;
            padding: 12px 15px;
            color: white;
            background-color: transparent;
            border: none;
            border-radius: 6px;
            text-align: left;
            text-decoration: none;
            cursor: pointer;
        }

        .menu-vertical .nav-link:hover {
            background-color: #376587;
            color: white;
        }

        .menu-vertical .nav-link:focus {
            color: white;
        }

        .menu-vertical .submenu {
            padding-left: 30px;
            font-size: 14px;
            color: #dce6ef;
        }

        .menu-vertical .submenu:hover {
            background-color: #376587;
            color: white;
        }

        .contenido-principal {
            flex: 1;
            min-width: 0;
            padding: 25px;
            background-color: #f4f7fb;
        }

        .contenido-principal .container-fluid {
            width: 100%;
            padding: 0;
        }

        .card {
            border-radius: 6px;
            border: 1px solid #dee2e6;
        }

        .table-responsive {
            overflow-x: auto;
        }

        .pie-pagina {
            background-color: #f4f7fb;
            color: #6c757d;
            padding: 20px;
            text-align: center;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .layout-principal {
                flex-direction: column;
            }

            .menu-vertical {
                width: 100%;
                min-width: 0;
            }

            .contenido-principal {
                padding: 15px;
            }

            .encabezado h1 {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>

    <header class="encabezado">
        <h1>Chile desigual: CASEN 2024</h1>
        <p>Brechas territoriales y calidad de vida en Chile</p>
    </header>

    <div class="layout-principal">

        {% include 'analisis/menu.html' %}

        <main class="contenido-principal">
            <div class="container-fluid">
                {% block contenido %}{% endblock %}
            </div>
        </main>

    </div>

    <footer class="pie-pagina">
        Proyecto de Visualización de Datos | CASEN 2024
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
